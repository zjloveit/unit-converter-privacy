name: UnitConverter

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 11.0.0

options:
  bundleIdPrefix: com.dizhenyujing
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic

targets:
  UnitConverter:
    type: application
    platform: iOS
    sources:
      - path: UnitConverter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dizhenyujing.unitconverter
        INFOPLIST_FILE: UnitConverter/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: NO
    entitlements:
      path: UnitConverter/UnitConverter.entitlements
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds

schemes:
  UnitConverter:
    build:
      targets:
        UnitConverter: all
    run:
      config: Debug
